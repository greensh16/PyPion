[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypion"
version = "1.1.2"
description = "Python package to open Silo data files from PION"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "Sam Green", email = "green@cp.dias.ie" },
    { name = "Jonathan Mackey" },
    { name = "Arun Mathew" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["pypion", "pion", "silo", "visualisation", "computational fluid dynamics"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
    "matplotlib",
]

[project.optional-dependencies]
# needed only for pion2yt.py, derived_fields_yt.py and example_plots_yt.py
yt = ["yt >= 4.4.0"]

[project.urls]
Homepage = "https://github.com/greensh16/PyPion"
Documentation = "https://pion-docs-dev.readthedocs.io/en/latest/python.html"
Issues = "https://github.com/greensh16/PyPion/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pypion*"]
