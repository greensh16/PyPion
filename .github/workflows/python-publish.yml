# Build PyPion and upload it to PyPI when a release is published on GitHub.
#
# Uses PyPI "trusted publishing" (no API token or password is stored in this
# repository).  One-time setup by an owner of the pypion project on PyPI:
#   https://pypi.org/manage/project/pypion/settings/publishing/
#   -> add a GitHub publisher with this repository's owner and name,
#      workflow "python-publish.yml" and environment "pypi".
# and in this GitHub repository: Settings -> Environments -> New environment
# "pypi" (optionally restricted to required reviewers).
#
# To make a release: update "version" in pyproject.toml, merge to master,
# then create a GitHub release with a tag matching the version (e.g. v1.1.2).

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pypion/
    permissions:
      id-token: write   # needed for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
